<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D AR Menu Demo</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .ar-instruction {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 999;
    }
  </style>
</head>
<body>

  <div class="ar-instruction">कैमरा टेबल की तरफ घुमाएं!</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-assets>
      <a-asset-item id="burger-model" src="https://raw.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb"></a-asset-item>
    </a-assets>

    <a-entity 
      gltf-model="#burger-model" 
      position="0 0 -1" 
      scale="5 5 5" 
      rotation="0 45 0"
      animation="property: rotation; to: 0 405 0; loop: true; dur: 10000">
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
